<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>デュエマサポーター</title>
    <!-- A-Frame & AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      /* --- 常に一定の大きさで読めるAR固定オーバーレイUI --- */
      #ar-card-overlay {
        display: none; /* マーカー認識時に表示 */
        position: fixed;
        top: 15%;
        right: 12px;
        width: 250px;
        max-width: 65vw;
        background: rgba(15, 23, 42, 0.94);
        border: 2px solid #3b82f6;
        border-radius: 12px;
        color: #ffffff;
        padding: 14px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
        z-index: 999;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        box-sizing: border-box;
        animation: fadeIn 0.2s ease-out;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
      }
      #overlay-title {
        font-size: 15px;
        font-weight: bold;
        color: #60a5fa;
        margin: 0 0 8px 0;
        border-bottom: 1px solid #334155;
        padding-bottom: 6px;
      }
      #overlay-desc {
        font-size: 12.5px;
        line-height: 1.5;
        color: #f8fafc;
        margin: 0 0 10px 0;
        white-space: pre-wrap;
      }
      #overlay-priority {
        display: block;
        background: #dc2626;
        color: #ffffff;
        font-size: 11px;
        font-weight: bold;
        padding: 5px 8px;
        border-radius: 6px;
        text-align: center;
      }

      /* --- 下部操作パネル --- */
      #ui-panel {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 420px;
        background: rgba(20, 24, 35, 0.9);
        color: #fff;
        padding: 12px 16px;
        border-radius: 12px;
        z-index: 1000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      }
      #status-text {
        font-size: 13px;
        font-weight: bold;
        color: #fbbf24;
        text-align: center;
        margin-bottom: 8px;
      }
      .link-btn {
        display: block;
        text-align: center;
        background: #e53e3e;
        color: white;
        text-decoration: none;
        padding: 8px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: bold;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- 画面上で常に一定サイズで表示される固定パネル（カードに被らず右側に固定配置） -->
    <div id="ar-card-overlay">
      <div id="overlay-title">カード効果</div>
      <div id="overlay-desc">効果テキスト</div>
      <div id="overlay-priority">処理順</div>
    </div>

    <!-- 下部ステータス & 裁定リンクパネル -->
    <div id="ui-panel">
      <div id="status-text">📷 カードのマーカーをかざしてください</div>
      <a id="rule-link" class="link-btn" href="https://dm.takaratomy.co.jp/rule/qa/" target="_blank">
        公式ルール・裁定ページを開く ↗
      </a>
    </div>

    <!-- AR空間（マーカー検出用） -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <!-- 1. シールド・トリガー用マーカー -->
      <a-marker id="marker-trigger" preset="custom" type="pattern" url="pattern-trigger.patt">
        <!-- カード位置を示すガイド枠（カードの真上に薄い青枠） -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="1.0" height="1.4" color="#3b82f6" opacity="0.4"></a-plane>
      </a-marker>

      <!-- 2. ガード・ストライク用マーカー -->
      <a-marker id="marker-guard" preset="custom" type="pattern" url="pattern-guard.patt">
        <!-- カード位置を示すガイド枠（カードの真上に薄い緑枠） -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="1.0" height="1.4" color="#10b981" opacity="0.4"></a-plane>
      </a-marker>

      <!-- 3. ブロッカー用マーカー -->
      <a-marker id="marker-blocker" preset="custom" type="pattern" url="pattern-blocker.patt">
        <!-- カード位置を示すガイド枠（カードの真上に薄い黄枠） -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="1.0" height="1.4" color="#f59e0b" opacity="0.4"></a-plane>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const termsData = {
        trigger: {
          title: "シールド・トリガー (S・トリガー)",
          desc: "このカードを自分のシールドゾーンから手札に加える時、コストを支払わずにすぐ実行してもよい",
          priority: "処理順: G・ストライク宣言の直後",
          url: "https://dm.takaratomy.co.jp/rule/qa/"
        },
        guard: {
          title: "ガード・ストライク (G・ストライク)",
          desc: "このカードを自分のシールドゾーンから手札に加える時、表向きにし、相手のクリーチャーを１体選んでもよい。このターン、そのクリーチャーは攻撃できない",
          priority: "処理順: ブレイク時に最優先で即座に宣言",
          url: "https://dm.takaratomy.co.jp/rule/qa/"
        },
        blocker: {
          title: "ブロッカー",
          desc: "このクリーチャーをタップして、相手クリーチャーの攻撃先をこのクリーチャーに変更してもよい",
          priority: "処理順: 攻撃時トリガー能力の発動後",
          url: "https://dm.takaratomy.co.jp/rule/qa/"
        }
      };

      const overlay = document.getElementById('ar-card-overlay');
      const titleEl = document.getElementById('overlay-title');
      const descEl = document.getElementById('overlay-desc');
      const priorityEl = document.getElementById('overlay-priority');
      const statusEl = document.getElementById('status-text');
      const ruleLink = document.getElementById('rule-link');

      let activeMarkerCount = 0;

      function setupMarkerEvents() {
        ['trigger', 'guard', 'blocker'].forEach(key => {
          const item = termsData[key];
          const markerEl = document.getElementById(`marker-${key}`);

          // マーカー認識時
          markerEl.addEventListener('markerFound', () => {
            activeMarkerCount++;
            titleEl.textContent = item.title;
            descEl.textContent = item.desc;
            priorityEl.textContent = item.priority;
            ruleLink.href = item.url;

            overlay.style.display = 'block';
            statusEl.textContent = `✅ 認識中: ${item.title}`;
            statusEl.style.color = '#4ade80';
          });

          // マーカー見失い時
          markerEl.addEventListener('markerLost', () => {
            activeMarkerCount = Math.max(0, activeMarkerCount - 1);
            if (activeMarkerCount === 0) {
              overlay.style.display = 'none';
              statusEl.textContent = '📷 カードのマーカーをかざしてください';
              statusEl.style.color = '#fbbf24';
            }
          });
        });
      }

      window.onload = () => {
        setupMarkerEvents();
      };
    </script>
  </body>
</html>
