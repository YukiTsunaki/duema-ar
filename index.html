<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>デュエマサポーター</title>
    <!-- A-Frame & AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      #ui-panel {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 420px;
        background: rgba(20, 24, 35, 0.9);
        color: #fff;
        padding: 12px 16px;
        border-radius: 12px;
        z-index: 1000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .btn-group {
        display: flex;
        gap: 6px;
        margin: 8px 0;
      }
      button {
        flex: 1;
        padding: 8px 4px;
        border: 1px solid #4a5568;
        border-radius: 6px;
        background: #2d3748;
        color: #fff;
        font-size: 11px;
        cursor: pointer;
      }
      button.active {
        background: #3182ce;
        border-color: #63b3ed;
        font-weight: bold;
      }
      .link-btn {
        display: block;
        text-align: center;
        background: #e53e3e;
        color: white;
        text-decoration: none;
        padding: 7px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: bold;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- 日本語テクスチャ生成用 Canvas（非表示） -->
    <div style="display: none;">
      <canvas id="textCanvas" width="512" height="384"></canvas>
    </div>

    <!-- 操作パネル（IoT盤面シミュレーション） -->
    <div id="ui-panel">
      <div style="font-size: 12px; font-weight: bold;">【デュエマサポーター】盤面状況 / 用語選択</div>
      <div class="btn-group">
        <button id="btn-st" class="active" onclick="switchTerm('st')">S・トリガー</button>
        <button id="btn-gs" onclick="switchTerm('gs')">G・ストライク</button>
        <button id="btn-blocker" onclick="switchTerm('blocker')">ブロッカー</button>
      </div>
      <a id="rule-link" class="link-btn" href="https://dm.takaratomy.co.jp/rule/qa/" target="_blank">
        公式ルール・裁定ページを開く ↗
      </a>
    </div>

    <!-- AR空間 -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
      <a-marker preset="hiro">
        <!-- カード本体の位置枠（カードが隠れない基準） -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="1.0" height="1.4" color="#4a5568" opacity="0.3"></a-plane>

        <!-- カード右側に浮かぶ日本語解説パネル (X軸方向に1.5ずらして配置) -->
        <a-plane id="ar-info-plane" 
                 position="1.5 0.1 0" 
                 rotation="-90 0 0" 
                 width="1.8" 
                 height="1.35" 
                 material="src: #textCanvas; transparent: true;">
        </a-plane>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const terms = {
        st: {
          title: "シールド・トリガー (S・トリガー)",
          lines: [
            "このカードを自分のシールドゾーンから",
            "手札に加える時、コストを支払わずに",
            "すぐ実行してもよい"
          ],
          priority: "処理順: G・ストライク宣言の直後",
          url: "https://dm.takaratomy.co.jp/rule/qa/"
        },
        gs: {
          title: "ガード・ストライク (G・ストライク)",
          lines: [
            "このカードを自分のシールドゾーンから",
            "手札に加える時、表向きにし、相手の",
            "クリーチャーを１体選んでもよい。",
            "このターン、そのクリーチャーは攻撃できない"
          ],
          priority: "処理順: ブレイク時に最優先で即座に宣言",
          url: "https://dm.takaratomy.co.jp/rule/qa/"
        },
        blocker: {
          title: "ブロッカー",
          lines: [
            "このクリーチャーをタップして、",
            "相手クリーチャーの攻撃先を",
            "このクリーチャーに変更してもよい"
          ],
          priority: "処理順: 攻撃時トリガー能力の発動後",
          url: "https://dm.takaratomy.co.jp/rule/qa/"
        }
      };

      // Canvasに日本語を描画し、3Dテクスチャを更新
      function renderText(termKey) {
        const data = terms[termKey];
        const canvas = document.getElementById('textCanvas');
        const ctx = canvas.getContext('2d');

        // 背景
        ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 外枠
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 8;
        ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);

        // タイトル
        ctx.fillStyle = '#60a5fa';
        ctx.font = 'bold 26px sans-serif';
        ctx.fillText(data.title, 24, 52);

        // 区切り線
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(24, 72);
        ctx.lineTo(canvas.width - 24, 72);
        ctx.stroke();

        // 本文（公式テキスト）
        ctx.fillStyle = '#f8fafc';
        ctx.font = '20px sans-serif';
        let y = 115;
        data.lines.forEach(line => {
          ctx.fillText(line, 24, y);
          y += 36;
        });

        // 優先度・処理順タグ枠
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(20, canvas.height - 68, canvas.width - 40, 46);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText(data.priority, 32, canvas.height - 38);

        // 3Dパネルのテクスチャを即時更新
        const plane = document.getElementById('ar-info-plane');
        if (plane && plane.getObject3D('mesh')) {
          const mat = plane.getObject3D('mesh').material;
          if (mat.map) {
            mat.map.needsUpdate = true;
          }
        }
      }

      function switchTerm(key) {
        document.querySelectorAll('.btn-group button').forEach(b => b.classList.remove('active'));
        document.getElementById(`btn-${key}`).classList.add('active');
        document.getElementById('rule-link').href = terms[key].url;
        renderText(key);
      }

      // 初回ロード時にS・トリガーを描画
      window.onload = () => {
        setTimeout(() => {
          renderText('st');
        }, 500);
      };
    </script>
  </body>
</html>
