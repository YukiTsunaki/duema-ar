<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>デュエマサポーター</title>
    <!-- A-Frame & AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
      #ui-panel {
        position: fixed;
        bottom: 15px;
        left: 50%;
        transform: translateX(-50%);
        width: 90%;
        max-width: 420px;
        background: rgba(20, 24, 35, 0.9);
        color: #fff;
        padding: 12px 16px;
        border-radius: 12px;
        z-index: 1000;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      }
      #status-text {
        font-size: 13px;
        font-weight: bold;
        color: #fbbf24;
        text-align: center;
        margin-bottom: 8px;
      }
      .link-btn {
        display: block;
        text-align: center;
        background: #e53e3e;
        color: white;
        text-decoration: none;
        padding: 8px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: bold;
      }
    </style>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <!-- 3つの用語描画用 Canvas（非表示） -->
    <div style="display: none;">
      <canvas id="canvas-trigger" width="512" height="384"></canvas>
      <canvas id="canvas-guard" width="512" height="384"></canvas>
      <canvas id="canvas-blocker" width="512" height="384"></canvas>
    </div>

    <!-- 下部ステータス & 裁定リンクパネル -->
    <div id="ui-panel">
      <div id="status-text">📷 カードのマーカーをかざしてください</div>
      <a id="rule-link" class="link-btn" href="https://dm.takaratomy.co.jp/rule/qa/" target="_blank">
        公式ルール・裁定ページを開く ↗
      </a>
    </div>

    <!-- AR空間 -->
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">

      <!-- 1. シールド・トリガー用マーカー -->
      <a-marker id="marker-trigger" preset="custom" type="pattern" url="pattern-trigger.patt">
        <!-- カード本体の配置枠（半透明） -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="1.0" height="1.4" color="#4a5568" opacity="0.3"></a-plane>
        <!-- カード右側に浮かぶAR解説パネル -->
        <a-plane id="plane-trigger" position="1.5 0.1 0" rotation="-90 0 0" width="1.8" height="1.35" 
                 material="src: #canvas-trigger; transparent: true;"></a-plane>
      </a-marker>

      <!-- 2. ガード・ストライク用マーカー -->
      <a-marker id="marker-guard" preset="custom" type="pattern" url="pattern-guard.patt">
        <!-- カード本体の配置枠（半透明） -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="1.0" height="1.4" color="#4a5568" opacity="0.3"></a-plane>
        <!-- カード右側に浮かぶAR解説パネル -->
        <a-plane id="plane-guard" position="1.5 0.1 0" rotation="-90 0 0" width="1.8" height="1.35" 
                 material="src: #canvas-guard; transparent: true;"></a-plane>
      </a-marker>

      <!-- 3. ブロッカー用マーカー -->
      <a-marker id="marker-blocker" preset="custom" type="pattern" url="pattern-blocker.patt">
        <!-- カード本体の配置枠（半透明） -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="1.0" height="1.4" color="#4a5568" opacity="0.3"></a-plane>
        <!-- カード右側に浮かぶAR解説パネル -->
        <a-plane id="plane-blocker" position="1.5 0.1 0" rotation="-90 0 0" width="1.8" height="1.35" 
                 material="src: #canvas-blocker; transparent: true;"></a-plane>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      const termsData = {
        trigger: {
          canvasId: 'canvas-trigger',
          planeId: 'plane-trigger',
          title: "シールド・トリガー (S・トリガー)",
          lines: [
            "このカードを自分のシールドゾーンから",
            "手札に加える時、コストを支払わずに",
            "すぐ実行してもよい"
          ],
          priority: "処理順: G・ストライク宣言の直後",
          url: "https://dm.takaratomy.co.jp/rule/qa/"
        },
        guard: {
          canvasId: 'canvas-guard',
          planeId: 'plane-guard',
          title: "ガード・ストライク (G・ストライク)",
          lines: [
            "このカードを自分のシールドゾーンから",
            "手札に加える時、表向きにし、相手の",
            "クリーチャーを１体選んでもよい。",
            "このターン、そのクリーチャーは攻撃できない"
          ],
          priority: "処理順: ブレイク時に最優先で即座に宣言",
          url: "https://dm.takaratomy.co.jp/rule/qa/"
        },
        blocker: {
          canvasId: 'canvas-blocker',
          planeId: 'plane-blocker',
          title: "ブロッカー",
          lines: [
            "このクリーチャーをタップして、",
            "相手クリーチャーの攻撃先を",
            "このクリーチャーに変更してもよい"
          ],
          priority: "処理順: 攻撃時トリガー能力の発動後",
          url: "https://dm.takaratomy.co.jp/rule/qa/"
        }
      };

      // 各Canvasに日本語テキストを描画
      function drawPanel(item) {
        const canvas = document.getElementById(item.canvasId);
        const ctx = canvas.getContext('2d');

        // 背景
        ctx.fillStyle = 'rgba(15, 23, 42, 0.95)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 外枠
        ctx.strokeStyle = '#3b82f6';
        ctx.lineWidth = 8;
        ctx.strokeRect(4, 4, canvas.width - 8, canvas.height - 8);

        // タイトル
        ctx.fillStyle = '#60a5fa';
        ctx.font = 'bold 26px sans-serif';
        ctx.fillText(item.title, 24, 52);

        // 区切り線
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(24, 72);
        ctx.lineTo(canvas.width - 24, 72);
        ctx.stroke();

        // 本文（公式テキスト）
        ctx.fillStyle = '#f8fafc';
        ctx.font = '20px sans-serif';
        let y = 115;
        item.lines.forEach(line => {
          ctx.fillText(line, 24, y);
          y += 36;
        });

        // 処理順・優先度タグ
        ctx.fillStyle = '#dc2626';
        ctx.fillRect(20, canvas.height - 68, canvas.width - 40, 46);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 20px sans-serif';
        ctx.fillText(item.priority, 32, canvas.height - 38);

        // テクスチャ更新フラグ
        const plane = document.getElementById(item.planeId);
        if (plane && plane.getObject3D('mesh')) {
          const mat = plane.getObject3D('mesh').material;
          if (mat.map) {
            mat.map.needsUpdate = true;
          }
        }
      }

      // マーカー検出イベント設定
      function setupMarkerEvents() {
        const statusEl = document.getElementById('status-text');
        const ruleLink = document.getElementById('rule-link');

        ['trigger', 'guard', 'blocker'].forEach(key => {
          const item = termsData[key];
          const markerEl = document.getElementById(`marker-${key}`);

          markerEl.addEventListener('markerFound', () => {
            statusEl.textContent = `✅ 認識中: ${item.title}`;
            statusEl.style.color = '#4ade80';
            ruleLink.href = item.url;
          });

          markerEl.addEventListener('markerLost', () => {
            statusEl.textContent = '📷 カードのマーカーをかざしてください';
            statusEl.style.color = '#fbbf24';
          });
        });
      }

      window.onload = () => {
        // 3枚のテクスチャを初期描画
        Object.values(termsData).forEach(item => drawPanel(item));
        setupMarkerEvents();
      };
    </script>
  </body>
</html>
